<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Let's connect with Shreya">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#171a2c"/>
      <stop offset="100%" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#262a42"/>
      <stop offset="1%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="470" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="470" rx="24" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="468.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <ellipse cx="240" cy="310" rx="180" ry="150" fill="#f472b6" opacity="0.12" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="62" width="360" height="330" rx="26" fill="#111827" fill-opacity="0.8" stroke="url(#accent)" stroke-opacity="0.5"/>
    <circle cx="200" cy="190" r="86" fill="#a78bfa" opacity="0.18"/>
    <circle cx="200" cy="165" r="54" fill="#f8fafc" opacity="0.9"/>
    <path d="M126 292c20-34 46-52 74-52s54 18 74 52v76H126v-76Z" fill="#22d3ee" opacity="0.88"/>
    <rect x="110" y="84" width="182" height="32" rx="16" fill="#ffffff" fill-opacity="0.03"/>
    <text x="124" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f472b6" font-weight="700" letter-spacing="2">CONNECT</text>
  </g>

  <g>
    <text x="470" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f472b6" font-weight="700" letter-spacing="2.2">// LET'S CONNECT</text>
    <text x="470" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="31" fill="#f8fafc" font-weight="700">Let's build something together</text>
    <text x="470" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#8d93ab">Open to collaborations, product work, and creative ideas.</text>
  </g>

  <g>
    <rect x="470" y="228" width="334" height="90" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#2a314d"/>
    <rect x="492" y="248" width="110" height="26" rx="13" fill="url(#chip)"/>
    <text x="547" y="267" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0d0e16" font-weight="700">GitHub</text>
    <text x="632" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="700">@its-shreya3</text>

    <rect x="470" y="332" width="334" height="90" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#2a314d"/>
    <rect x="492" y="352" width="110" height="26" rx="13" fill="url(#chip)"/>
    <text x="547" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0d0e16" font-weight="700">Email</text>
    <text x="632" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f8fafc" font-weight="700">dalapatishreya3@gmail.com</text>
  </g>

  <g>
    <text x="472" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8d93ab">“<tspan fill="#f472b6">Code is my art, logic is my superpower.</tspan>”</text>
  </g>

  <g>
    <text x="970" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="58" fill="#f8fafc" font-weight="700" letter-spacing="-1.5">Shreya</text>
    <text x="972" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#a78bfa" letter-spacing="2.5">SOFTWARE DEVELOPER</text>
  </g>
</svg>
