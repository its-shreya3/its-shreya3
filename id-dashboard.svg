<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="Developer dashboard for Shreya Dalapati">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#121728"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="photoClip">
      <rect x="80" y="128" width="176" height="210" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1280" height="600" fill="url(#bg)"/>
  <rect width="1280" height="600" fill="url(#dots)"/>

  <g opacity="0.65">
    <circle cx="140" cy="110" r="120" fill="#22d3ee" opacity="0.14"/>
    <circle cx="1170" cy="80" r="150" fill="#a78bfa" opacity="0.12"/>
    <circle cx="1080" cy="530" r="180" fill="#f472b6" opacity="0.10"/>
  </g>

  <!-- Header -->
  <g>
    <text x="420" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#a78bfa" font-weight="700">// DEVELOPER DASHBOARD</text>
    <text x="420" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#f8fafc" font-weight="700">Profile at a glance</text>
    <g transform="translate(1090 65)">
      <rect x="0" y="-16" width="162" height="28" rx="14" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="18" cy="-2" r="4" fill="#34d399"/>
      <text x="31" y="2" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#34d399" font-weight="700" letter-spacing="1.4">LIVE • GITHUB</text>
    </g>
  </g>

  <!-- Stats cards -->
  <g>
    <rect x="420" y="126" width="190" height="95" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#2a314d"/>
    <text x="442" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8d93ab" font-weight="700">REPOS</text>
    <text x="442" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" font-weight="700">142</text>
    <g transform="translate(552 156)">
      <rect x="0" y="0" width="28" height="18" rx="8" fill="#22d3ee" opacity="0.12"/>
      <text x="14" y="13" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22d3ee" font-weight="700">14k</text>
    </g>
  </g>

  <g>
    <rect x="420" y="240" width="470" height="310" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#2a314d"/>
    <text x="442" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8d93ab" font-weight="700">MOST-STARRED PROJECTS</text>

    <g>
      <text x="442" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cbd5e1">Naruto — Sage Mode</text>
      <rect x="590" y="300" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="590" y="300" width="138" height="14" rx="7" fill="url(#bar)"/>

      <text x="442" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cbd5e1">Zoro — King of Hell</text>
      <rect x="590" y="339" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="590" y="339" width="122" height="14" rx="7" fill="url(#bar)"/>

      <text x="442" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cbd5e1">Demon Slayer — Yoriichi &amp; Kokushibo</text>
      <rect x="590" y="378" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="590" y="378" width="108" height="14" rx="7" fill="url(#bar)"/>

      <text x="442" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cbd5e1">JJK — Sukuna</text>
      <rect x="590" y="417" width="220" height="14" rx="7" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="590" y="417" width="100" height="14" rx="7" fill="url(#bar)"/>
    </g>

    <text x="442" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8d93ab" opacity="0.8">anime web builds • motion-driven portfolio work</text>
  </g>

  <!-- Community card -->
  <g>
    <rect x="914" y="240" width="300" height="146" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#2a314d"/>
    <text x="936" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8d93ab" font-weight="700">COMMUNITY</text>
    <text x="936" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#f8fafc" font-weight="700">4.7K</text>
    <text x="936" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#8d93ab">IG FOLLOWERS</text>
    <text x="1078" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#f8fafc" font-weight="700">2.7M</text>
    <text x="1078" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" letter-spacing="1.1" fill="#8d93ab">VIEWS / 30 DAYS</text>
    <text x="936" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8d93ab" opacity="0.8">@its-shreya3</text>
  </g>

  <!-- Focus card -->
  <g>
    <rect x="914" y="400" width="300" height="150" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#2a314d"/>
    <circle cx="938" cy="438" r="4" fill="#22d3ee"/>
    <text x="952" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#8d93ab" font-weight="700">CURRENT FOCUS</text>
    <text x="936" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f8fafc" font-weight="700">Frontend &amp; motion</text>
    <text x="936" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8d93ab">design systems • product UI</text>
  </g>

  <!-- Identity card -->
  <g filter="url(#shadow)">
    <rect x="72" y="182" width="300" height="360" rx="24" fill="url(#card)" stroke="url(#accent)" stroke-opacity="0.5"/>
    <rect x="72" y="182" width="300" height="32" fill="#ffffff" fill-opacity="0.03"/>
    <text x="95" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" letter-spacing="2.2" fill="#22d3ee" font-weight="700">DEVELOPER ID</text>
    <text x="346" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8d93ab" text-anchor="end" font-weight="700">v2.0</text>

    <g>
      <rect x="92" y="228" width="260" height="210" rx="22" fill="#ffffff" fill-opacity="0.02" stroke="#2a314d"/>
      <rect x="114" y="250" width="116" height="150" rx="18" fill="#111827"/>
      <rect x="188" y="250" width="126" height="150" rx="18" fill="#ffffff" fill-opacity="0.02"/>

      <!-- Small avatar block -->
      <g clip-path="url(#photoClip)">
        <rect x="114" y="250" width="116" height="150" fill="#0f172a"/>
        <circle cx="172" cy="282" r="28" fill="#a78bfa" opacity="0.95"/>
        <path d="M136 386c18-22 38-34 60-34s42 12 60 34v14H136v-14Z" fill="#22d3ee" opacity="0.9"/>
        <circle cx="172" cy="284" r="16" fill="#f8fafc" opacity="0.9"/>
      </g>

      <text x="194" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f8fafc" font-weight="700">Shreya</text>
      <text x="194" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8d93ab" letter-spacing="1.7">DALAPATI</text>
      <text x="194" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a78bfa" letter-spacing="1.3">SOFTWARE</text>
      <text x="194" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a78bfa" letter-spacing="1.3">DEVELOPER</text>
      <rect x="190" y="372" width="108" height="1.5" fill="url(#accent)"/>
      <text x="194" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8d93ab">Kolkata, IN</text>
      <text x="194" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8d93ab">its-shreya3</text>
    </g>

    <g transform="translate(90 458)">
      <circle cx="0" cy="0" r="4" fill="#34d399"/>
      <text x="12" y="4" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#34d399" font-weight="700" letter-spacing="1.4">OPEN TO COLLAB</text>
    </g>
  </g>

  <g transform="translate(164 522)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a78bfa" font-weight="700" letter-spacing="2">SHREYA.DEV</text>
  </g>
</svg>
